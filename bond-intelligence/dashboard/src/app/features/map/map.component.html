<div class="map-page">
  <div class="map-controls">
    <h2 class="map-title">Opportunity Map</h2>
    <select class="filter-select" [(ngModel)]="selectedState" (change)="filterByState()">
      <option value="">All States ({{ agencies.length }})</option>
      <option *ngFor="let s of states" [value]="s">{{ s }}</option>
    </select>
    <div class="map-legend">
      <span class="legend-dot" style="background:#ef4444"></span><span>Hot (70+)</span>
      <span class="legend-dot" style="background:#f97316"></span><span>Warm (50+)</span>
      <span class="legend-dot" style="background:#3b82f6"></span><span>Cool (30+)</span>
      <span class="legend-dot" style="background:#6b7280"></span><span>Cold</span>
    </div>
    <span class="map-count">{{ filteredAgencies.length }} agencies shown</span>
  </div>
  <div id="map" class="leaflet-map"></div>
  <div class="map-loading" *ngIf="loading">Loading map data…</div>
</div>
