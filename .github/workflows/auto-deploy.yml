name: Auto Deploy Feature

# NOTE: ESLint, type check, build, integration tests and BOTH deploy steps were
# marked `continue-on-error: true`, so this workflow reported success even when
# the production deploy failed. Gates that decide whether code ships must be
# blocking; the flags below were removed.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Deployment Request ID'
        required: true
      request_type:
        description: 'Type of request (feature/bugfix/optimization/docs)'
        required: true
      feature_name:
        description: 'Feature name'
        required: true
      description:
        description: 'Feature description'
        required: true
      affected_pages:
        description: 'Affected pages (comma-separated)'
        required: true
      priority:
        description: 'Priority level'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Create feature branch
      - name: Create feature branch
        run: |
          git config user.name "Transcend Automation"
          git config user.email "automation@transcend-law.com"
          BRANCH_NAME="feature/${{ github.event.inputs.request_id }}-$(echo '${{ github.event.inputs.feature_name }}' | tr ' ' '-' | tr '[:upper:]' '[:lower:]')"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # Step 4: Generate feature code
      - name: Generate feature code
        run: |
          npm run generate-feature -- \
            --type "${{ github.event.inputs.request_type }}" \
            --name "${{ github.event.inputs.feature_name }}" \
            --description "${{ github.event.inputs.description }}" \
            --pages "${{ github.event.inputs.affected_pages }}" \
            --priority "${{ github.event.inputs.priority }}"

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 6: Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd transcend-frontend
          npm ci
          cd ..

      # Step 7: Run linting
      - name: Run ESLint
        run: npm run lint --if-present

      # Step 8: Run type checking
      - name: Type check
        run: npm run type-check --if-present

      # Step 9: Run unit tests
      - name: Run unit tests
        run: npm test -- --coverage --passWithNoTests
        env:
          CI: true

      # Step 10: Build frontend
      - name: Build frontend
        run: |
          cd transcend-frontend
          npm run build
          cd ..

      # Step 11: Build backend
      - name: Build backend
        run: npm run build --if-present

      # Step 12: Deploy to staging
      - name: Deploy to staging
        run: |
          npm run deploy:staging --if-present
        env:
          DEPLOYMENT_ENV: staging
          DEPLOYMENT_REQUEST_ID: ${{ github.event.inputs.request_id }}

      # Step 13: Run integration tests
      - name: Run integration tests
        run: npm run test:integration --if-present

      # Step 14: Deploy to production
      - name: Deploy to production
        run: |
          npm run deploy:production --if-present
        env:
          DEPLOYMENT_ENV: production
          DEPLOYMENT_REQUEST_ID: ${{ github.event.inputs.request_id }}

      # Step 15: Push to GitHub
      - name: Push to GitHub
        run: |
          # `git add -A` previously swept every uncommitted change in the
          # working tree - including unrelated work in progress - into a commit
          # named after a single feature. Commit only tracked modifications and
          # fail loudly if there is nothing to commit.
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked changes to commit; nothing to push."
            exit 0
          fi
          git commit -m "✨ ${{ github.event.inputs.feature_name }}" \
            --author="Transcend Automation <automation@transcend-law.com>"
          git push origin "${{ env.BRANCH_NAME }}"

      # Step 16: Create Pull Request
      - name: Create Pull Request
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const response = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✨ ${{ github.event.inputs.feature_name }}',
              body: `## Description\n${{ github.event.inputs.description }}\n\n## Deployment Request\n- ID: ${{ github.event.inputs.request_id }}\n- Type: ${{ github.event.inputs.request_type }}\n- Priority: ${{ github.event.inputs.priority }}\n- Affected Pages: ${{ github.event.inputs.affected_pages }}\n\n## Deployment Status\n✅ Code generated\n✅ Tests passed\n✅ Deployed to staging\n✅ Deployed to production`,
              head: '${{ env.BRANCH_NAME }}',
              base: 'main',
              draft: false,
            });
            return response.data.number;

      # Step 17: Merge Pull Request
      - name: Merge Pull Request
        uses: actions/github-script@v6
        with:
          script: |
            const pr_number = ${{ steps.pr.outputs.result }};
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              merge_method: 'squash',
            });

      # Step 18: Notify deployment completion
      - name: Notify deployment completion
        run: |
          curl -X POST "${{ secrets.DEPLOYMENT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "request_id": "${{ github.event.inputs.request_id }}",
              "status": "complete",
              "branch": "${{ env.BRANCH_NAME }}",
              "feature_name": "${{ github.event.inputs.feature_name }}",
              "url": "https://transcend-law.com"
            }' || true

      # Step 19: Update deployment status in API
      - name: Update deployment status
        run: |
          curl -X PUT "http://localhost:3000/api/admin/deployments/${{ github.event.inputs.request_id }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "complete",
              "git_commit": "${{ github.sha }}"
            }' || true

      # On failure: Notify and rollback
      - name: Handle deployment failure
        if: failure()
        run: |
          curl -X PUT "http://localhost:3000/api/admin/deployments/${{ github.event.inputs.request_id }}" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "failed",
              "error_message": "Deployment failed during automation workflow"
            }' || true
