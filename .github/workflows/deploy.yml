name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: transcend-frontend
        run: npm ci

      - name: Run tests
        working-directory: transcend-frontend
        run: npm test -- --passWithNoTests
        continue-on-error: true

      - name: Build frontend
        working-directory: transcend-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.transcend-law.com' }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: transcend-frontend
        run: |
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL=${{ secrets.VITE_API_URL || 'https://api.transcend-law.com' }} \
            --env ENVIRONMENT=production
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Wait for deployment
        run: sleep 30

      - name: Verify deployment
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Checking deployment status (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."

            RESPONSE=$(curl -s -w "\n%{http_code}" https://transcend-law.com)
            STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)

            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Deployment verified successfully"
              exit 0
            fi

            echo "⏳ Status code: $STATUS_CODE, retrying..."
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 10
          done

          echo "❌ Deployment verification failed after $MAX_RETRIES attempts"
          exit 1

      - name: Notify success
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: 'https://transcend-law.com',
              description: 'Deployment successful',
            })

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Deployment failed - see logs for details')
